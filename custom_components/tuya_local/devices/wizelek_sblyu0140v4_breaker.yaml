name: Circuit breaker
# WizElek smart RCBO V4 and early V5 (2024 firmware, type A, 40 A)
# Same data point layout as the Tongou AT-Q-SMR1 family (tongou_qcb2wb_breaker).
# Safety choices: earth leakage limit and earth leakage action are read-only,
# leakage test, self check and factory reset are not exposed.
products:
  - id: bttupiwu58lhuarc
    manufacturer: WizElek
    model: SBLYU01-40 V5 (2024)
  - id: atwj3jbfqjkuhxvv
    manufacturer: WizElek
    model: SBLYU01-40 V4
entities:
  - entity: switch
    translation_key: breaker
    dps:
      - id: 16
        type: boolean
        name: switch
      - id: 124
        type: integer
        optional: true
        name: signal
      - id: 125
        type: string
        optional: true
        name: firmware_version
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    translation_key: leakage_current
    class: current
    category: diagnostic
    dps:
      - id: 15
        type: integer
        name: sensor
        unit: mA
        class: measurement
  - entity: sensor
    class: voltage
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: V
        class: measurement
        mapping:
          - scale: 10
      - id: 108
        type: integer
        optional: true
        name: rated_voltage
  - entity: sensor
    class: current
    dps:
      - id: 107
        type: integer
        name: sensor
        unit: A
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    dps:
      - id: 117
        type: integer
        name: sensor
        unit: W
        class: measurement
  - entity: sensor
    class: temperature
    dps:
      - id: 109
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Event
    icon: "mdi:information-outline"
    category: diagnostic
    dps:
      - id: 119
        type: string
        name: sensor
        optional: true
  - entity: switch
    name: Automatic reclosing
    icon: "mdi:restart"
    category: config
    dps:
      - id: 123
        type: boolean
        name: switch
        optional: true
  - entity: number
    name: Current limit
    class: current
    category: config
    dps:
      - id: 102
        type: integer
        name: value
        unit: A
        range:
          min: 1
          max: 40
  - entity: number
    name: Overvoltage limit
    class: voltage
    category: config
    dps:
      - id: 103
        type: integer
        name: value
        unit: V
        range:
          min: 245
          max: 295
  - entity: number
    name: Undervoltage limit
    class: voltage
    category: config
    dps:
      - id: 104
        type: integer
        name: value
        unit: V
        range:
          min: 145
          max: 220
  - entity: sensor
    name: Earth leakage limit
    icon: "mdi:flash-alert"
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: mA
  - entity: number
    name: Temperature limit
    class: temperature
    category: config
    dps:
      - id: 110
        type: integer
        name: value
        unit: C
        range:
          min: 400
          max: 1000
        mapping:
          - scale: 10
  - entity: number
    name: Power limit
    class: power
    category: config
    dps:
      - id: 118
        type: integer
        name: value
        unit: W
        range:
          min: 100
          max: 10000
        mapping:
          - step: 10
  - entity: select
    translation_key: breaker_trigger_action
    translation_placeholders:
      trigger: Overvoltage
    category: config
    dps:
      - id: 111
        type: string
        name: option
        mapping:
          - dps_val: Close
            value: ignore
          - dps_val: Alarm
            value: alarm
          - dps_val: Trip
            value: trip_breaker
  - entity: select
    translation_key: breaker_trigger_action
    translation_placeholders:
      trigger: Undervoltage
    category: config
    dps:
      - id: 112
        type: string
        name: option
        mapping:
          - dps_val: Close
            value: ignore
          - dps_val: Alarm
            value: alarm
          - dps_val: Trip
            value: trip_breaker
  - entity: select
    translation_key: breaker_trigger_action
    translation_placeholders:
      trigger: Over current
    category: config
    dps:
      - id: 113
        type: string
        name: option
        mapping:
          - dps_val: Close
            value: ignore
          - dps_val: Alarm
            value: alarm
          - dps_val: Trip
            value: trip_breaker
  - entity: select
    translation_key: breaker_trigger_action
    translation_placeholders:
      trigger: Over power
    category: config
    dps:
      - id: 114
        type: string
        name: option
        mapping:
          - dps_val: Close
            value: ignore
          - dps_val: Alarm
            value: alarm
          - dps_val: Trip
            value: trip_breaker
  - entity: select
    translation_key: breaker_trigger_action
    translation_placeholders:
      trigger: Over temperature
    category: config
    dps:
      - id: 115
        type: string
        name: option
        mapping:
          - dps_val: Close
            value: ignore
          - dps_val: Alarm
            value: alarm
          - dps_val: Trip
            value: trip_breaker
  - entity: sensor
    name: Earth leakage action
    class: enum
    icon: "mdi:flash-alert"
    category: diagnostic
    dps:
      - id: 116
        type: string
        name: sensor
        mapping:
          - dps_val: Close
            value: Ignore
          - dps_val: Alarm
            value: Alarm
          - dps_val: Trip
            value: Trip
