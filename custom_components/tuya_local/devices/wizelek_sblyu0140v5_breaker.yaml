name: Circuit breaker
# WizElek smart RCBO V5 (type A, 40 A) - Tuya product ZN05_RCBO_220V_A
# Data points from the manufacturer specification.
# Safety choices: the residual current (30 mA) protection is read-only,
# factory reset and power-off delays are not exposed.
products:
  - id: nymtcbsnfhdea17y
    manufacturer: WizElek
    model: SBLYU01-40 V5
entities:
  - entity: switch
    translation_key: breaker
    dps:
      - id: 16
        type: boolean
        name: switch
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    name: Combined active energy
    class: energy
    category: diagnostic
    dps:
      - id: 24
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        optional: true
        mapping:
          - scale: 100
  # phase_a, V2 format, 18 bytes, big endian:
  # version(1) length(1) voltage(2, 0.1 V) current(3, mA) active power(3, W)
  # reactive power(3, var) apparent power(3, VA) power factor(1, 0.01)
  # direction(1)
  - entity: sensor
    class: voltage
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: V
        class: measurement
        optional: true
        mask: "0000FFFF0000000000000000000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: A
        class: measurement
        optional: true
        mask: "00000000FFFFFF0000000000000000000000"
        mapping:
          - scale: 1000
  - entity: sensor
    class: power
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: W
        class: measurement
        optional: true
        mask: "00000000000000FFFFFF0000000000000000"
  - entity: sensor
    class: reactive_power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: var
        class: measurement
        optional: true
        mask: "00000000000000000000FFFFFF0000000000"
  - entity: sensor
    class: apparent_power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        unit: VA
        class: measurement
        optional: true
        mask: "00000000000000000000000000FFFFFF0000"
  - entity: sensor
    class: power_factor
    category: diagnostic
    dps:
      - id: 6
        type: base64
        name: sensor
        class: measurement
        optional: true
        mask: "00000000000000000000000000000000FF00"
        mapping:
          - scale: 100
  - entity: sensor
    class: temperature
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: C
        class: measurement
        optional: true
        mapping:
          - scale: 10
  - entity: sensor
    class: frequency
    category: diagnostic
    dps:
      - id: 32
        type: integer
        name: sensor
        unit: Hz
        class: measurement
        optional: true
        mapping:
          - scale: 100
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 9
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 9
        type: bitfield
        name: fault_code
      - id: 9
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Short circuit
          - dps_val: 2
            value: Surge
          - dps_val: 4
            value: Overload
          - dps_val: 8
            value: Earth leakage
          - dps_val: 16
            value: High temperature
          - dps_val: 32
            value: Arc fault
          - dps_val: 64
            value: High power
          - dps_val: 128
            value: Leakage self test fault
          - dps_val: 256
            value: Overcurrent
          - dps_val: 512
            value: Unbalanced
          - dps_val: 1024
            value: Overvoltage
          - dps_val: 2048
            value: Undervoltage
          - dps_val: 4096
            value: Phase loss
          - dps_val: 8192
            value: Outage
          - dps_val: 16384
            value: Magnetism
          - dps_val: 32768
            value: Low credit
          - dps_val: 65536
            value: No credit
          - dps_val: 131072
            value: Leakage pre-warning
          - dps_val: 262144
            value: Overcurrent pre-warning
          - dps_val: 524288
            value: Overvoltage pre-warning
          - dps_val: 1048576
            value: Overpower pre-warning
          - dps_val: 2097152
            value: Undervoltage pre-warning
          - dps_val: 4194304
            value: High temperature pre-warning
  - entity: switch
    name: Automatic reclosing
    icon: "mdi:restart"
    category: config
    dps:
      - id: 49
        type: boolean
        name: switch
        optional: true
  - entity: button
    name: Refresh
    icon: "mdi:sync"
    category: config
    dps:
      - id: 35
        type: string
        name: button
        optional: true
        mapping:
          - dps_val: online
            value: true
  # alarm_set_1 (DP 17), 3 items of 4 bytes on this model:
  # item code(1) action(1: 0 alarm only, 1 alarm and trip, 2 disabled)
  # threshold(2)
  # 04 earth leakage (mA) - read-only by design
  # 05 high temperature (C)
  # 07 high power (W)
  - entity: sensor
    name: Earth leakage threshold
    icon: "mdi:flash-alert"
    category: diagnostic
    dps:
      - id: 17
        type: base64
        name: sensor
        unit: mA
        optional: true
        mask: "0000FFFF0000000000000000"
  - entity: sensor
    name: Earth leakage action
    class: enum
    icon: "mdi:flash-alert"
    category: diagnostic
    dps:
      - id: 17
        type: base64
        name: sensor
        optional: true
        mask: "00FF00000000000000000000"
        mapping:
          - dps_val: 0
            value: Alarm only
          - dps_val: 1
            value: Alarm and trip
          - dps_val: 2
            value: Disabled
  - entity: number
    name: High temperature threshold
    class: temperature
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        unit: C
        optional: true
        mask: "000000000000FFFF00000000"
        range:
          min: 40
          max: 100
  - entity: select
    name: High temperature action
    icon: "mdi:thermometer-alert"
    category: config
    dps:
      - id: 17
        type: base64
        name: option
        optional: true
        mask: "0000000000FF000000000000"
        mapping:
          - dps_val: 0
            value: Alarm only
          - dps_val: 1
            value: Alarm and trip
          - dps_val: 2
            value: Disabled
  - entity: number
    name: High power threshold
    class: power
    category: config
    dps:
      - id: 17
        type: base64
        name: value
        unit: W
        optional: true
        mask: "00000000000000000000FFFF"
        range:
          min: 100
          max: 10000
        mapping:
          - step: 10
  - entity: select
    name: High power action
    icon: "mdi:flash"
    category: config
    dps:
      - id: 17
        type: base64
        name: option
        optional: true
        mask: "000000000000000000FF0000"
        mapping:
          - dps_val: 0
            value: Alarm only
          - dps_val: 1
            value: Alarm and trip
          - dps_val: 2
            value: Disabled
  # alarm_set_2 (DP 18), 3 items of 4 bytes on this model:
  # 01 overcurrent (A), 03 overvoltage (V), 04 undervoltage (V)
  - entity: number
    name: Overcurrent threshold
    class: current
    category: config
    dps:
      - id: 18
        type: base64
        name: value
        unit: A
        optional: true
        mask: "0000FFFF0000000000000000"
        range:
          min: 1
          max: 40
  - entity: select
    name: Overcurrent action
    icon: "mdi:current-ac"
    category: config
    dps:
      - id: 18
        type: base64
        name: option
        optional: true
        mask: "00FF00000000000000000000"
        mapping:
          - dps_val: 0
            value: Alarm only
          - dps_val: 1
            value: Alarm and trip
          - dps_val: 2
            value: Disabled
  - entity: number
    name: Overvoltage threshold
    class: voltage
    category: config
    dps:
      - id: 18
        type: base64
        name: value
        unit: V
        optional: true
        mask: "000000000000FFFF00000000"
        range:
          min: 245
          max: 295
  - entity: select
    name: Overvoltage action
    icon: "mdi:flash-triangle"
    category: config
    dps:
      - id: 18
        type: base64
        name: option
        optional: true
        mask: "0000000000FF000000000000"
        mapping:
          - dps_val: 0
            value: Alarm only
          - dps_val: 1
            value: Alarm and trip
          - dps_val: 2
            value: Disabled
  - entity: number
    name: Undervoltage threshold
    class: voltage
    category: config
    dps:
      - id: 18
        type: base64
        name: value
        unit: V
        optional: true
        mask: "00000000000000000000FFFF"
        range:
          min: 145
          max: 220
  - entity: select
    name: Undervoltage action
    icon: "mdi:flash-triangle-outline"
    category: config
    dps:
      - id: 18
        type: base64
        name: option
        optional: true
        mask: "000000000000000000FF0000"
        mapping:
          - dps_val: 0
            value: Alarm only
          - dps_val: 1
            value: Alarm and trip
          - dps_val: 2
            value: Disabled
